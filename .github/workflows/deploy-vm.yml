# 推到 main 時建置管理端，發布到 GitHub Release「admin-latest」。
# GCP VM 每 2 分鐘檢查一次，有新版本就自己下載並切換（deploy/zerone-admin-update.sh），
# 網址：https://devtools.dev.terrylinla.com/admin/
# VM 不用開 SSH，這裡也不需要任何 VM 的金鑰。設定步驟見 deploy/README.md。
# API 網址：在 Settings → Secrets and variables → Actions → Variables 新增 VM_API_BASE（沒設就用程式裡的預設值）。
name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 建置
        env:
          API_BASE: ${{ vars.VM_API_BASE }}
        run: |
          if [ -n "$API_BASE" ]; then export VITE_API_BASE="$API_BASE"; fi
          npm run build

      - name: 打包並發布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          tar -czf admin.tar.gz -C dist .
          sha256sum admin.tar.gz | cut -d' ' -f1 > admin.tar.gz.sha256
          echo "$VERSION" > version.txt
          if ! gh release view admin-latest >/dev/null 2>&1; then
            gh release create admin-latest --prerelease --title "管理端部署（VM 自動下載）" \
              --notes "GCP VM 會自動下載這裡的最新版本。不要手動修改或刪除。"
          fi
          # 先傳網站檔案，最後才傳版本號，VM 看到新版本號時檔案已經在了
          gh release upload admin-latest admin.tar.gz admin.tar.gz.sha256 --clobber
          gh release upload admin-latest version.txt --clobber
          echo "已發布 $VERSION，VM 會在 2 分鐘內更新。"
