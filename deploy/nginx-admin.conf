# 零壹雲管家管理端：掛在 https://devtools.dev.terrylinla.com/admin/
# vm-setup.sh 會把這個檔放到 /etc/nginx/snippets/zerone-admin.conf，
# 並在 devtools.dev.terrylinla.com 的 server 區塊裡加一行 include。
# 網站檔案由 GitHub Actions 部署到 /var/www/zerone-admin/releases/<版本>，current 指向目前版本。

location = /admin {
    absolute_redirect off;
    return 301 /admin/;
}

# 打包後的 JS／CSS 檔名含雜湊，可以長期快取
location /admin/assets/ {
    alias /var/www/zerone-admin/current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html 每次都要重新檢查，部署新版後使用者重新整理就會拿到
location /admin/ {
    alias /var/www/zerone-admin/current/;
    index index.html;
    add_header Cache-Control "no-cache";
}
